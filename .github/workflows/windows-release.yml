name: Windows Release Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.6.3'
  LMC_VERSION: '1.3.0'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DLMC_VERSION="${{ env.LMC_VERSION }}" `
            -DLMC_BUILD_TESTS=ON

      - name: Build LAN Messenger & Crypto Unit Tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Run OpenSSL 3.0 <-> 1.0 Interoperability Unit Tests
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Stage Windows Release & Build NSIS Installer
        shell: pwsh
        run: |
          $stageDir = "lmc/release"
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          New-Item -ItemType Directory -Force -Path "$stageDir/lang/system", "$stageDir/sounds", "$stageDir/themes" | Out-Null

          # 1. Copy built executable and external resource bundle
          $exeFile = Get-ChildItem -Path build -Recurse -Filter "lmc.exe" | Select-Object -First 1
          if (-not $exeFile) {
            Write-Error "lmc.exe not found in build directory!"
            exit 1
          }
          Copy-Item $exeFile.FullName -Destination "$stageDir/lmc.exe" -Force

          $rccFile = Get-ChildItem -Path build -Recurse -Filter "lmc.rcc" | Select-Object -First 1
          if ($rccFile) {
            Copy-Item $rccFile.FullName -Destination "$stageDir/lmc.rcc" -Force
          }

          # 2. Copy language (.qm), sounds, and themes assets
          if (Test-Path "lmc/src/resources/lang") {
            Copy-Item "lmc/src/resources/lang/*.qm" -Destination "$stageDir/lang/" -Force
          }
          Get-ChildItem -Path build -Recurse -Filter "*.qm" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "$stageDir/lang/" -Force
          }
          if (Test-Path "lmc/src/resources/sounds") {
            Copy-Item "lmc/src/resources/sounds/*" -Destination "$stageDir/sounds/" -Recurse -Force
          }
          if (Test-Path "lmc/src/resources/themes") {
            Copy-Item "lmc/src/resources/themes/*" -Destination "$stageDir/themes/" -Recurse -Force
          }

          # 3. Deploy Qt 6 runtime DLLs and system translations
          windeployqt --release --no-opengl-sw --no-system-d3d-compiler "$stageDir/lmc.exe"
          Remove-Item "$stageDir/vc_redist*.exe" -Force -ErrorAction SilentlyContinue
          if (Test-Path "$stageDir/translations") {
            Copy-Item "$stageDir/translations/qtbase_*.qm" -Destination "$stageDir/lang/system/" -Force -ErrorAction SilentlyContinue
          }

          # 4. Bundle OpenSSL 3.x and MSVC runtime DLLs
          foreach ($dir in @("C:\Program Files\OpenSSL\bin", "C:\Program Files\OpenSSL-Win64\bin", "$env:OPENSSL_ROOT_DIR\bin")) {
            if (Test-Path $dir) {
              Get-ChildItem -Path $dir -Include "libcrypto*.dll", "libssl*.dll" -Recurse | Copy-Item -Destination $stageDir -Force
            }
          }
          foreach ($crt in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll")) {
            $crtPath = "$env:SystemRoot\System32\$crt"
            if (Test-Path $crtPath) {
              Copy-Item $crtPath -Destination $stageDir -Force
            }
          }

          Copy-Item "LICENSE", "README.md" -Destination $stageDir -Force -ErrorAction SilentlyContinue

          # 5. Build NSIS Windows Setup Installer (lmc-1.3.0-win64.exe)
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y
          }
          Push-Location "lmc/setup/win32"
          & $makensis /DExeFolder=release /DProductVersion=${{ env.LMC_VERSION }} /DInstallerVersion=${{ env.LMC_VERSION }}.0 setup.nsi
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            Write-Error "NSIS installer build failed!"
            exit 1
          }
          Pop-Location
          Move-Item "lmc/setup/win32/lmc-${{ env.LMC_VERSION }}-win64.exe" "lmc-${{ env.LMC_VERSION }}-win64.exe" -Force

          # 6. Create Portable ZIP archive
          Compress-Archive -Path "$stageDir/*" -DestinationPath "lan-messenger-windows-x64.zip" -Force

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lan-messenger-windows-x64-v${{ env.LMC_VERSION }}
          path: |
            lmc-${{ env.LMC_VERSION }}-win64.exe
            lan-messenger-windows-x64.zip

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.LMC_VERSION }}"
          name: "LAN Messenger v${{ env.LMC_VERSION }} Windows Release"
          body: |
            Automated Windows x64 Release of LAN Messenger v${{ env.LMC_VERSION }} (Qt ${{ env.QT_VERSION }} / MSVC 2022).
            - **Windows Installer (Setup Wizard)**: `lmc-${{ env.LMC_VERSION }}-win64.exe`
            - **Windows Portable ZIP**: `lan-messenger-windows-x64.zip`
            - Includes all 20 languages (`ko_KR` Korean included) in both embedded resources and `lang/` folder
            - OpenSSL 3.0 <-> 1.0 Legacy Compatibility Architecture & Remote Desktop Control
          files: |
            lmc-${{ env.LMC_VERSION }}-win64.exe
            lan-messenger-windows-x64.zip
          draft: false
          prerelease: false
