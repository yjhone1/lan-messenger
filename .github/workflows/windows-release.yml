name: Windows Release Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.6.3'
  LMC_VERSION: '1.3.0'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DLMC_VERSION="${{ env.LMC_VERSION }}" `
            -DLMC_ENABLE_TESTS=ON

      - name: Build LAN Messenger & Crypto Unit Tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Run OpenSSL 3.0 <-> 1.0 Interoperability Unit Tests
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Stage Windows Portable Release Package
        shell: pwsh
        run: |
          $distDir = "dist-win64"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          # Copy built binaries
          $exePaths = Get-ChildItem -Path build -Recurse -Filter "lmc.exe"
          foreach ($exe in $exePaths) {
            Copy-Item $exe.FullName -Destination $distDir -Force
          }
          $dllPaths = Get-ChildItem -Path build -Recurse -Filter "lmcapp*.dll"
          foreach ($dll in $dllPaths) {
            Copy-Item $dll.FullName -Destination $distDir -Force
          }

          # Run windeployqt to bundle Qt 6 runtime DLLs and plugins
          if (Test-Path "$distDir/lmc.exe") {
            windeployqt --release --no-translations "$distDir/lmc.exe"
          }

          # Bundle OpenSSL 3.x runtime DLLs (libcrypto-3-x64.dll, libssl-3-x64.dll)
          $opensslDirs = @(
            "C:\Program Files\OpenSSL\bin",
            "C:\Program Files\OpenSSL-Win64\bin",
            "$env:OPENSSL_ROOT_DIR\bin"
          )
          foreach ($dir in $opensslDirs) {
            if (Test-Path $dir) {
              Get-ChildItem -Path $dir -Filter "libcrypto*.dll" | Copy-Item -Destination $distDir -Force
              Get-ChildItem -Path $dir -Filter "libssl*.dll" | Copy-Item -Destination $distDir -Force
            }
          }

          # Copy application resources and license
          Copy-Item "LICENSE" -Destination $distDir -Force -ErrorAction SilentlyContinue
          Copy-Item "README.md" -Destination $distDir -Force -ErrorAction SilentlyContinue

          Compress-Archive -Path "$distDir/*" -DestinationPath "lan-messenger-windows-x64.zip" -Force

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-messenger-windows-x64-v${{ env.LMC_VERSION }}
          path: lan-messenger-windows-x64.zip

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.3.0"
          name: "LAN Messenger v1.3.0 Windows Release"
          body: |
            Automated Windows x64 build of LAN Messenger v1.3.0 (Qt ${{ env.QT_VERSION }} / MSVC 2022).
            - Base version: v1.2.39
            - Added OpenSSL 3.0 <-> 1.0 Legacy Compatibility Architecture (PKCS#1 PEM, RSA-1024/2048 OAEP SHA-1/SHA-256 fallback)
            - Added Remote Desktop Control (`lmc/src/remote/`)
            - Added GitHub Releases (`releases/latest`) version check
          files: lan-messenger-windows-x64.zip
          draft: false
          prerelease: false
